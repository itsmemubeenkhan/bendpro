name: Build BendPro Release AAB (permanent upload key)

# Manual release builds. CI compiles + debug-signs the AAB (no secrets needed);
# the AAB is then RE-SIGNED locally with the permanent Play upload keystore
# (~/workspace/keystores/bendpro.jks) via jarsigner before Play upload.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: bendpro-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
