name: Build BendPro AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Generate test keystore
        run: |
          keytool -genkeypair -v -keystore /tmp/bendpro-test.jks -keyalg RSA -keysize 2048 -validity 10000 -alias bendpro -storepass testpass123 -keypass testpass123 -dname "CN=BendPro Test"
          echo "storeFile=/tmp/bendpro-test.jks" > android/key.properties
          echo "keyAlias=bendpro" >> android/key.properties
          echo "storePassword=testpass123" >> android/key.properties
          echo "keyPassword=testpass123" >> android/key.properties
      - run: flutter pub get
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: bendpro-aab
          path: build/app/outputs/bundle/release/app-release.aab
